# Services for Tado X integration

set_temperature_offset:
  name: Set temperature offset
  description: Adjust the temperature offset for a Tado X device (valve or sensor). This calibrates the device's temperature reading.
  fields:
    device_id:
      name: Device
      description: The Tado X device to calibrate
      required: true
      selector:
        device:
          integration: tado_x
    offset:
      name: Temperature offset
      description: Temperature offset in °C. Positive values make the device read higher, negative values make it read lower.
      required: true
      example: -2.0
      selector:
        number:
          min: -9.9
          max: 9.9
          step: 0.1
          unit_of_measurement: "°C"

add_meter_reading:
  name: Add meter reading
  description: Upload a meter reading to Tado Energy IQ
  fields:
    reading:
      name: Reading
      description: Meter reading value (integer)
      required: true
      example: 12345
      selector:
        number:
          min: 0
          max: 999999999
          mode: box
    date:
      name: Date
      description: Date of reading (YYYY-MM-DD format, defaults to today)
      required: false
      example: "2026-01-14"
      selector:
        text:

set_eiq_tariff:
  name: Set energy tariff
  description: Set an energy tariff in Tado Energy IQ for cost calculations
  fields:
    tariff:
      name: Tariff
      description: Price per unit (e.g., 0.85 for €0.85/m³)
      required: true
      example: 0.85
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
          mode: box
    unit:
      name: Unit
      description: Energy unit type
      required: true
      example: "m3"
      selector:
        select:
          options:
            - label: "Cubic meters (m³)"
              value: "m3"
            - label: "Kilowatt hours (kWh)"
              value: "kWh"
    start_date:
      name: Start date
      description: Start date for the tariff (YYYY-MM-DD format, defaults to today)
      required: false
      example: "2026-01-01"
      selector:
        text:
    end_date:
      name: End date
      description: End date for the tariff (YYYY-MM-DD format, leave empty for ongoing tariff)
      required: false
      example: "2026-12-31"
      selector:
        text:

set_climate_timer:
  name: Set climate timer
  description: Set a room temperature for a specific duration. Useful for temporary overrides like a quick boost or extending heating.
  target:
    entity:
      integration: tado_x
      domain: climate
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X climate entity (room) to control
      required: true
      example: "climate.living_room"
      selector:
        entity:
          integration: tado_x
          domain: climate
    temperature:
      name: Temperature
      description: Target temperature in °C
      required: true
      example: 22.0
      selector:
        number:
          min: 5.0
          max: 25.0
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      name: Duration
      description: Duration in minutes (1-1440, i.e., up to 24 hours)
      required: true
      example: 30
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: "min"

get_schedule:
  name: Get schedule
  description: Read the current smart heating schedule for a room. Returns the schedule blocks as a response.
  target:
    entity:
      integration: tado_x
      domain: climate

set_schedule:
  name: Set schedule
  description: Modify the smart heating schedule for a room. Replaces the blocks for the given day type.
  target:
    entity:
      integration: tado_x
      domain: climate
  fields:
    day_type:
      name: Day type
      description: Which day(s) this schedule applies to.
      required: true
      example: "MONDAY_TO_SUNDAY"
      selector:
        select:
          options:
            - label: "Every day"
              value: "MONDAY_TO_SUNDAY"
            - label: "Weekdays"
              value: "MONDAY_TO_FRIDAY"
            - label: "Monday"
              value: "MONDAY"
            - label: "Tuesday"
              value: "TUESDAY"
            - label: "Wednesday"
              value: "WEDNESDAY"
            - label: "Thursday"
              value: "THURSDAY"
            - label: "Friday"
              value: "FRIDAY"
            - label: "Saturday"
              value: "SATURDAY"
            - label: "Sunday"
              value: "SUNDAY"
    schedule:
      name: Schedule blocks
      description: >-
        JSON array of schedule blocks. Each block: {"dayType": "MONDAY_TO_SUNDAY",
        "start": "07:00", "end": "09:00", "geolocationOverride": false,
        "setting": {"type": "HEATING", "power": "ON", "temperature": {"value": 21.0}}}
      required: true
      example: '[{"dayType":"MONDAY_TO_SUNDAY","start":"07:00","end":"09:00","setting":{"type":"HEATING","power":"ON","temperature":{"value":21.0}}}]'
      selector:
        text:
          multiline: true

get_day_report:
  name: Get day report
  description: Read historical temperature, humidity and heating data for a room and date. Returns the report and a summary as a response.
  target:
    entity:
      integration: tado_x
      domain: climate
  fields:
    date:
      name: Date
      description: Date to fetch (YYYY-MM-DD). Defaults to today.
      required: false
      example: "2026-10-13"
      selector:
        text:
